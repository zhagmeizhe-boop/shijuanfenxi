[tool.poetry]
name = "math-analysis-backend"
version = "0.1.0"
description = "小学数学分班考试卷六维分析系统后端"
authors = ["Tech Team <tech@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
redis = "^5.0.0"
celery = "^5.3.0"
pillow = "^10.2.0"
pymupdf = "^1.23.0"
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.27.0"
tenacity = "^8.2.0"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
sentry-sdk = "^1.40.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
factory-boy = "^3.3.0"
faker = "^23.0.0"
mypy = "^1.8.0"
ruff = "^0.3.0"
black = "^24.0.0"
isort = "^5.13.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

<svg width="1800" height="1000" viewBox="0 0 1800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3,3 L17,10 L3,17" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif;
        letter-spacing: 0;
      }
      .title { font-size: 44px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 22px; fill: #475569; }
      .card-title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .card-body { font-size: 20px; fill: #475569; }
      .small { font-size: 18px; fill: #64748b; }
      .outcome-title { font-size: 30px; font-weight: 700; fill: #ffffff; }
      .outcome-body { font-size: 19px; fill: #cbd5e1; }
      .num { font-size: 28px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="url(#bg)"/>
  <circle cx="80" cy="20" r="260" fill="#ffffff" opacity="0.35"/>
  <circle cx="1740" cy="930" r="320" fill="#ffffff" opacity="0.35"/>

  <text x="900" y="100" text-anchor="middle" class="title">项目定位：从试卷到可沉淀的六维分析报告</text>
  <text x="900" y="155" text-anchor="middle" class="subtitle">面向小学数学试卷，把人工经验判断转成可量化、可解释、可沉淀的分析结果</text>

  <g transform="translate(90 270)" filter="url(#cardShadow)">
    <rect width="300" height="250" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <circle cx="56" cy="56" r="32" fill="#2563eb"/>
    <text x="56" y="66" text-anchor="middle" class="num">1</text>
    <text x="112" y="66" class="card-title">上传试卷</text>
    <text x="150" y="136" text-anchor="middle" class="card-body">
      <tspan x="150" dy="0">老师 / 教研人员上传</tspan>
      <tspan x="150" dy="34">PDF、JPG、PNG 格式试卷</tspan>
    </text>
  </g>

  <line x1="390" y1="395" x2="420" y2="395" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(420 270)" filter="url(#cardShadow)">
    <rect width="300" height="250" rx="28" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <circle cx="56" cy="56" r="32" fill="#0891b2"/>
    <text x="56" y="66" text-anchor="middle" class="num">2</text>
    <text x="112" y="66" class="card-title">题目识别</text>
    <text x="150" y="136" text-anchor="middle" class="card-body">
      <tspan x="150" dy="0">OCR / 视觉 LLM</tspan>
      <tspan x="150" dy="34">自动识别题目内容</tspan>
    </text>
  </g>

  <line x1="720" y1="395" x2="750" y2="395" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(750 270)" filter="url(#cardShadow)">
    <rect width="300" height="250" rx="28" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
    <circle cx="56" cy="56" r="32" fill="#0f766e"/>
    <text x="56" y="66" text-anchor="middle" class="num">3</text>
    <text x="112" y="66" class="card-title">题目理解</text>
    <text x="150" y="136" text-anchor="middle" class="card-body">
      <tspan x="150" dy="0">提取题号、题型、分值</tspan>
      <tspan x="150" dy="34">并结构化入库</tspan>
    </text>
  </g>

  <line x1="1050" y1="395" x2="1080" y2="395" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1080 270)" filter="url(#cardShadow)">
    <rect width="300" height="250" rx="28" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="56" cy="56" r="32" fill="#7c3aed"/>
    <text x="56" y="66" text-anchor="middle" class="num">4</text>
    <text x="112" y="66" class="card-title">六维评价</text>
    <text x="150" y="128" text-anchor="middle" class="card-body">
      <tspan x="150" dy="0">数学运算、几何直观</tspan>
      <tspan x="150" dy="32">信息转化、实践创新</tspan>
      <tspan x="150" dy="32">知识广度、逻辑链条</tspan>
    </text>
  </g>

  <line x1="1380" y1="395" x2="1410" y2="395" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1410 270)" filter="url(#cardShadow)">
    <rect width="300" height="250" rx="28" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <circle cx="56" cy="56" r="32" fill="#db2777"/>
    <text x="56" y="66" text-anchor="middle" class="num">5</text>
    <text x="112" y="66" class="card-title">报告输出</text>
    <text x="150" y="136" text-anchor="middle" class="card-body">
      <tspan x="150" dy="0">报告展示 + PDF 导出</tspan>
      <tspan x="150" dy="34">支撑汇报、复盘和调卷</tspan>
    </text>
  </g>

  <rect x="190" y="650" width="1420" height="190" rx="34" fill="#0f172a"/>
  <text x="900" y="704" text-anchor="middle" font-size="19" fill="#93c5fd">最终形成的业务价值</text>

  <text x="430" y="758" text-anchor="middle" class="outcome-title">可量化</text>
  <text x="430" y="800" text-anchor="middle" class="outcome-body">用六维得分和整卷等级描述试卷定位</text>
  <text x="668" y="772" text-anchor="middle" font-size="32" font-weight="700" fill="#38bdf8">+</text>

  <text x="900" y="758" text-anchor="middle" class="outcome-title">可解释</text>
  <text x="900" y="800" text-anchor="middle" class="outcome-body">保留题级依据，说明为什么这样评分</text>
  <text x="1132" y="772" text-anchor="middle" font-size="32" font-weight="700" fill="#38bdf8">+</text>

  <text x="1370" y="758" text-anchor="middle" class="outcome-title">可沉淀</text>
  <text x="1370" y="800" text-anchor="middle" class="outcome-body">把分析结果沉淀为结构化教研资产</text>

  <text x="900" y="920" text-anchor="middle" class="small">适用场景：领导汇报 / 教研复盘 / 试卷调优 / 分析结果留档</text>
</svg>

x-api-env: &api-env
  ENVIRONMENT: production
  DEBUG: "false"
  APP_HOST: 0.0.0.0
  APP_PORT: "8100"
  APP_WORKERS: ${APP_WORKERS:-2}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-math_analysis}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-86400}
  TASK_STALE_MINUTES: ${TASK_STALE_MINUTES:-60}
  MAX_RUNNING_ANALYSIS_TASKS: ${MAX_RUNNING_ANALYSIS_TASKS:-2}
  MAX_QUEUED_ANALYSIS_TASKS: ${MAX_QUEUED_ANALYSIS_TASKS:-10}
  ANALYSIS_SLOT_RETRY_SECONDS: ${ANALYSIS_SLOT_RETRY_SECONDS:-10}
  ANALYSIS_SLOT_TTL_SECONDS: ${ANALYSIS_SLOT_TTL_SECONDS:-900}
  ANALYSIS_SLOT_HEARTBEAT_SECONDS: ${ANALYSIS_SLOT_HEARTBEAT_SECONDS:-60}
  OCR_PROVIDER: ${OCR_PROVIDER:-vision_llm}
  VISION_LLM_MODEL: ${VISION_LLM_MODEL:-}
  VISION_LLM_CONCURRENCY: ${VISION_LLM_CONCURRENCY:-5}
  VISION_LLM_PAGE_TIMEOUT: ${VISION_LLM_PAGE_TIMEOUT:-90}
  VISION_LLM_RENDER_DPI: ${VISION_LLM_RENDER_DPI:-180}
  VISION_LLM_MAX_TOKENS: ${VISION_LLM_MAX_TOKENS:-12000}
  QUESTION_LLM_CONCURRENCY: ${QUESTION_LLM_CONCURRENCY:-15}
  QUESTION_LLM_MAX_TOKENS: ${QUESTION_LLM_MAX_TOKENS:-2800}
  QUESTION_LLM_TIMEOUT_SECONDS: ${QUESTION_LLM_TIMEOUT_SECONDS:-75}
  GLOBAL_LLM_CONCURRENCY: ${GLOBAL_LLM_CONCURRENCY:-40}
  GLOBAL_VISION_LLM_CONCURRENCY: ${GLOBAL_VISION_LLM_CONCURRENCY:-15}
  GLOBAL_QUESTION_LLM_CONCURRENCY: ${GLOBAL_QUESTION_LLM_CONCURRENCY:-30}
  GLOBAL_LLM_ACQUIRE_TIMEOUT_SECONDS: ${GLOBAL_LLM_ACQUIRE_TIMEOUT_SECONDS:-120}
  GLOBAL_LLM_RETRY_INTERVAL_SECONDS: ${GLOBAL_LLM_RETRY_INTERVAL_SECONDS:-0.5}
  GLOBAL_LLM_SLOT_TTL_SECONDS: ${GLOBAL_LLM_SLOT_TTL_SECONDS:-300}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://one-api.aixuexi.com/v1}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
  BAIDU_OCR_APP_ID: ${BAIDU_OCR_APP_ID:-}
  BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
  BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
  UPLOAD_DIR: /app/uploads
  REPORT_OUTPUT_DIR: /app/reports
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-6}
  MAX_IMAGE_COUNT: ${MAX_IMAGE_COUNT:-20}
  SINGLE_IMAGE_MAX_SIZE: ${SINGLE_IMAGE_MAX_SIZE:-10485760}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:15-alpine
    container_name: math-analysis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-math_analysis}
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
    volumes:
      - ${MATH_ANALYSIS_DATA_DIR:-./.deploy-data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-math_analysis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: math-analysis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --tcp-keepalive 60
    volumes:
      - ${MATH_ANALYSIS_DATA_DIR:-./.deploy-data}/redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_CHROMIUM_MIRROR: ${PLAYWRIGHT_CHROMIUM_MIRROR:-https://storage.googleapis.com/chrome-for-testing-public}
    container_name: math-analysis-api
    restart: unless-stopped
    environment:
      <<: *api-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --workers ${APP_WORKERS:-2}
    volumes:
      - ${MATH_ANALYSIS_DATA_DIR:-./.deploy-data}/uploads:/app/uploads
      - ${MATH_ANALYSIS_DATA_DIR:-./.deploy-data}/reports:/app/reports
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_CHROMIUM_MIRROR: ${PLAYWRIGHT_CHROMIUM_MIRROR:-https://storage.googleapis.com/chrome-for-testing-public}
    container_name: math-analysis-worker
    restart: unless-stopped
    environment:
      <<: *api-env
    command: celery -A app.tasks.celery_app:celery worker --loglevel=${CELERY_LOG_LEVEL:-info} --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-20}
    volumes:
      - ${MATH_ANALYSIS_DATA_DIR:-./.deploy-data}/uploads:/app/uploads
      - ${MATH_ANALYSIS_DATA_DIR:-./.deploy-data}/reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery inspect ping -d celery@$$HOSTNAME | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: math-analysis-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: math-analysis-network
    driver: bridge
